<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350">
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#246A8A"/></marker><marker id="tealArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#168C8C"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<style>text{font-family:Arial,sans-serif;fill:#24313D}.title{font-size:28px;font-weight:700;fill:#17324D}.label{font-size:24px}.small{font-size:21px}.tiny{font-size:18px}.axis{stroke:#5C6B78;stroke-width:2}.arm{stroke:#246A8A;stroke-width:16;stroke-linecap:round}.joint{fill:#FFFFFF;stroke:#17324D;stroke-width:4}.path{fill:none;stroke:#168C8C;stroke-width:5;stroke-dasharray:12 8}.solid{fill:#EAF2F5;stroke:#246A8A;stroke-width:2}.concept{fill:#F8FAFB;stroke:#738594;stroke-width:2;stroke-dasharray:8 6}.bin{fill:#EAF2F5;stroke:#246A8A;stroke-width:3}.package{fill:#E5A842;stroke:#9A6722;stroke-width:2}.muted{fill:#5C6B78}.good{fill:#168C8C}.bad{fill:#B45A4A}</style>
<text x="38" y="42" class="title">Package handling logic · gate, attach, release, verify</text>
<rect x="35" y="105" width="205" height="150" rx="15" fill="#EAF2F5" stroke="#246A8A" stroke-width="3"/>
<text x="51" y="143" class="label">1 · Align</text>
<text x="51" y="183" class="small">Offset ≤12 mm</text>
<text x="51" y="211" class="small">Yaw ≤8°</text>
<line x1="240" y1="180" x2="265" y2="180" stroke="#168C8C" stroke-width="4" marker-end="url(#tealArrow)"/>
<rect x="270" y="105" width="205" height="150" rx="15" fill="#EAF2F5" stroke="#246A8A" stroke-width="3"/>
<text x="286" y="143" class="label">2 · Qualify</text>
<text x="286" y="183" class="small">both pad sensors</text>
<text x="286" y="211" class="small">width + virtual force</text>
<line x1="475" y1="180" x2="500" y2="180" stroke="#168C8C" stroke-width="4" marker-end="url(#tealArrow)"/>
<rect x="505" y="105" width="205" height="150" rx="15" fill="#EAF2F5" stroke="#246A8A" stroke-width="3"/>
<text x="521" y="143" class="label">3 · Carry</text>
<text x="521" y="183" class="small">Rapier fixed joint</text>
<text x="521" y="211" class="small">attachment required</text>
<line x1="710" y1="180" x2="735" y2="180" stroke="#168C8C" stroke-width="4" marker-end="url(#tealArrow)"/>
<rect x="740" y="105" width="205" height="150" rx="15" fill="#EAF2F5" stroke="#246A8A" stroke-width="3"/>
<text x="756" y="143" class="label">4 · Release</text>
<text x="756" y="183" class="small">remove joint</text>
<text x="756" y="211" class="small">package dynamic</text>
<line x1="945" y1="180" x2="970" y2="180" stroke="#168C8C" stroke-width="4" marker-end="url(#tealArrow)"/>
<rect x="975" y="105" width="205" height="150" rx="15" fill="#E8F4F0" stroke="#246A8A" stroke-width="3"/>
<text x="991" y="143" class="label">5 · Verify</text>
<text x="991" y="183" class="small">target region +</text>
<text x="991" y="211" class="small">settled velocities</text>
<text x="55" y="302" class="small">No package teleport on grasp: captured relative pose is constrained; release restores dynamic motion.</text>
</svg>