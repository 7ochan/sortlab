<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560">
  <defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5 0 7Z" fill="#24527a"/></marker><style>.axis{stroke:#526675;stroke-width:2;marker-end:url(#a)}.reach{fill:none;stroke:#95a9b8;stroke-width:2;stroke-dasharray:8 6}.path{fill:none;stroke:#15806e;stroke-width:4;stroke-dasharray:9 6;marker-end:url(#a)}.bin{fill:#edf4f8;stroke:#24527a;stroke-width:2}.txt{font:16px Arial;fill:#18354a}.small{font:13px Arial;fill:#566b79}.head{font:700 22px Arial;fill:#15324b}.point{fill:#d49332;stroke:#fff;stroke-width:2}.cell{stroke:#314957;stroke-width:3;fill:#aec1ce}.floor{fill:#e7eef2;stroke:#728898;stroke-width:2}.labelbox{fill:#f7fafc;stroke:#b4c2cb;stroke-width:1.5}</style></defs>
