<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650">
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4 0 8Z" fill="#24527a"/></marker><style>.state{fill:#f1f6fa;stroke:#24527a;stroke-width:2;rx:16}.term{fill:#e5f3ef;stroke:#277a68;stroke-width:2;rx:16}.fault{fill:#fbefea;stroke:#a84e37;stroke-width:2;rx:16}.txt{font:700 15px Arial;fill:#17344b}.small{font:12px Arial;fill:#455c6d}.edge{stroke:#24527a;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.bad{stroke:#a84e37;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.lab{font:12px Arial;fill:#566b79}</style></defs>
  <text x="28" y="34" style="font:700 22px Arial;fill:#15324b">Autonomous controller: explicit states and verification gates</text>
  <rect x="30" y="80" width="140" height="64" class="state"/><text x="68" y="118" class="txt">Idle</text>
  <rect x="205" y="80" width="180" height="64" class="state"/><text x="220" y="108" class="txt">Selecting</text><text x="220" y="129" class="small">validate package/bin</text>
  <rect x="420" y="80" width="170" height="64" class="state"/><text x="454" y="108" class="txt">Planning</text><text x="435" y="129" class="small">route before motion</text>
  <rect x="625" y="80" width="200" height="64" class="state"/><text x="641" y="108" class="txt">Moving to pickup</text><text x="642" y="129" class="small">fixed-step trajectory</text>
  <rect x="860" y="80" width="210" height="64" class="state"/><text x="872" y="108" class="txt">Align / grasp</text><text x="874" y="129" class="small">actual attach check; ≤1 retry</text>
  <path d="M170 112 H200" class="edge"/><path d="M385 112 H415" class="edge"/><path d="M590 112 H620" class="edge"/><path d="M825 112 H855" class="edge"/>
  <rect x="860" y="220" width="210" height="64" class="state"/><text x="930" y="259" class="txt">Lifting</text>
  <rect x="625" y="220" width="200" height="64" class="state"/><text x="689" y="259" class="txt">Transporting</text>
  <rect x="420" y="220" width="170" height="64" class="state"/><text x="463" y="259" class="txt">Releasing</text>
  <rect x="205" y="220" width="180" height="64" class="state"/><text x="214" y="247" class="txt">Verify placement</text><text x="217" y="269" class="small">pose + settled velocity</text>
  <rect x="30" y="220" width="140" height="64" class="state"/><text x="41" y="247" class="txt">Returning home</text><text x="47" y="269" class="small">reverse route + home</text>
  <path d="M965 144 V215" class="edge"/><path d="M860 252 H830" class="edge"/><path d="M625 252 H595" class="edge"/><path d="M420 252 H390" class="edge"/><path d="M205 252 H175" class="edge"/>
  <rect x="30" y="355" width="140" height="60" class="term"/><text x="69" y="391" class="txt">Completed</text><path d="M100 284 V350" class="edge"/><text x="110" y="325" class="lab">verified target bin</text>
  <rect x="420" y="355" width="210" height="60" class="term"/><text x="454" y="391" class="txt">Aborted / stopped</text>
  <rect x="735" y="355" width="300" height="60" class="fault"/><text x="785" y="391" class="txt">Recoverable fault with diagnostics</text>
  <path d="M250 145 C280 310 450 330 500 350" class="bad"/><path d="M945 145 C1030 260 950 320 900 350" class="bad"/><path d="M530 284 C650 330 750 335 800 350" class="bad"/>
  <text x="228" y="200" class="lab">route/grasp/attachment/placement/timeout/exception</text>
  <path d="M120 144 C30 295 330 315 425 365" class="bad"/><path d="M780 220 C870 310 720 330 625 380" class="bad"/><text x="652" y="322" class="lab">user abort at active stages</text>
  <rect x="220" y="470" width="690" height="92" class="state"/><text x="245" y="501" class="txt">Success gate</text><text x="245" y="526" class="small">Only Completed + correct-bin acceptance + 0.25 s below both velocity limits earns a sort.</text><text x="245" y="548" class="small">Reset from terminal/fault clears attachment/body state; invalid transitions fault visibly.</text>
  <path d="M780 415 C780 465 700 465 700 470" class="edge"/>
  <text x="30" y="615" class="small">States and fault outcomes follow src/engineering/sortingController.ts; UI renders snapshots and does not own state transitions.</text>
</svg>
