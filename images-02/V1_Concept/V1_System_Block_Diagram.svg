<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 7, 0 7" fill="#17324D"/>
    </marker>
    <marker id="arrow-rev" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#17324D"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 7, 0 7" fill="#168C8C"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 7, 0 7" fill="#E5A842"/>
    </marker>
    <marker id="arrow-slate" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 7, 0 7" fill="#5C6B78"/>
    </marker>
    <marker id="arrow-slate-rev" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#5C6B78"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="#FAFAFA"/>

  <!-- Title -->
  <text x="450" y="34" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#17324D" text-anchor="middle">Fig. V1-2: System Block Diagram — Preliminary Architecture</text>

  <!-- ===== ENVIRONMENT TOP: Package Input ===== -->
  <!-- Dashed box (conceptual) -->
  <rect x="310" y="60" width="280" height="52" rx="5" fill="#FFF8EC" stroke="#E5A842" stroke-width="2" stroke-dasharray="7,4"/>
  <text x="450" y="82" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#C07820" text-anchor="middle">ENVIRONMENT — INPUT</text>
  <text x="450" y="99" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#C07820" text-anchor="middle">Package Input (conveyor concept)</text>

  <!-- Arrow from environment down to sensing -->
  <line x1="290" y1="86" x2="218" y2="165" stroke="#E5A842" stroke-width="1.5" marker-end="url(#arrow-amber)" stroke-dasharray="5,3"/>
  <text x="225" y="133" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#C07820" transform="rotate(-45,225,133)">pkg arrives</text>

  <!-- ===== SENSING BLOCK (left column) ===== -->
  <text x="95" y="148" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#246A8A" text-anchor="middle">SENSING</text>

  <!-- Sensor 1: Package ID (dashed = conceptual) -->
  <rect x="25" y="158" width="200" height="56" rx="5" fill="#EAF2F5" stroke="#246A8A" stroke-width="2" stroke-dasharray="7,4"/>
  <text x="125" y="180" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#246A8A" text-anchor="middle">Package ID Sensor</text>
  <text x="125" y="196" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5C6B78" text-anchor="middle">(barcode/vision concept)</text>
  <text x="125" y="208" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#5C6B78" text-anchor="middle">[conceptual hardware]</text>

  <!-- Sensor 2: Position Feedback (dashed = conceptual) -->
  <rect x="25" y="230" width="200" height="56" rx="5" fill="#EAF2F5" stroke="#246A8A" stroke-width="2" stroke-dasharray="7,4"/>
  <text x="125" y="252" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#246A8A" text-anchor="middle">Position Feedback</text>
  <text x="125" y="268" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5C6B78" text-anchor="middle">(encoders concept)</text>
  <text x="125" y="280" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#5C6B78" text-anchor="middle">[conceptual hardware]</text>

  <!-- Arrow: Sensor1 → Controller (ID signal) -->
  <line x1="226" y1="183" x2="308" y2="210" stroke="#17324D" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="255" y="195" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#17324D">ID signal</text>

  <!-- ===== CONTROLLER BLOCK (centre) ===== -->
  <!-- Solid box (implemented in simulation) -->
  <rect x="308" y="155" width="284" height="230" rx="7" fill="#F0F5FA" stroke="#17324D" stroke-width="3"/>
  <text x="450" y="178" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#17324D" text-anchor="middle">SORTING CONTROLLER</text>
  <text x="450" y="195" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5C6B78" text-anchor="middle">[implemented in simulation]</text>

  <!-- Sub-blocks inside controller -->
  <rect x="325" y="205" width="250" height="44" rx="4" fill="#EAF2F5" stroke="#246A8A" stroke-width="1.5"/>
  <text x="450" y="222" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#246A8A" text-anchor="middle">Classification</text>
  <text x="450" y="237" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5C6B78" text-anchor="middle">Package type → target bin</text>

  <rect x="325" y="257" width="250" height="44" rx="4" fill="#EAF2F5" stroke="#246A8A" stroke-width="1.5"/>
  <text x="450" y="274" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#246A8A" text-anchor="middle">Path Planning</text>
  <text x="450" y="289" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5C6B78" text-anchor="middle">Trajectory generation, IK solve</text>

  <rect x="325" y="309" width="250" height="44" rx="4" fill="#EAF2F5" stroke="#246A8A" stroke-width="1.5"/>
  <text x="450" y="326" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#246A8A" text-anchor="middle">Motion Control</text>
  <text x="450" y="341" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5C6B78" text-anchor="middle">Joint command output, state machine</text>

  <!-- Arrow: Controller → Sort decision (up) -->
  <line x1="450" y1="155" x2="450" y2="116" stroke="#5C6B78" stroke-width="1.5" marker-end="url(#arrow-slate)" stroke-dasharray="5,3"/>
  <text x="458" y="140" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#5C6B78">Sort decision</text>

  <!-- ===== ACTUATION BLOCK (right column) ===== -->
  <text x="775" y="148" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#168C8C" text-anchor="middle">ACTUATION</text>

  <!-- Actuation drives — dashed (conceptual hardware) -->
  <rect x="670" y="158" width="206" height="40" rx="4" fill="#E6F5F5" stroke="#168C8C" stroke-width="2" stroke-dasharray="7,4"/>
  <text x="773" y="174" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#168C8C" text-anchor="middle">J1 Drive (rotary)</text>
  <text x="773" y="188" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#5C6B78" text-anchor="middle">[conceptual hardware]</text>

  <rect x="670" y="204" width="206" height="40" rx="4" fill="#E6F5F5" stroke="#168C8C" stroke-width="2" stroke-dasharray="7,4"/>
  <text x="773" y="220" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#168C8C" text-anchor="middle">J2 Drive (rotary)</text>
  <text x="773" y="234" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#5C6B78" text-anchor="middle">[conceptual hardware]</text>

  <rect x="670" y="250" width="206" height="40" rx="4" fill="#E6F5F5" stroke="#168C8C" stroke-width="2" stroke-dasharray="7,4"/>
  <text x="773" y="266" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#168C8C" text-anchor="middle">J3 Drive (linear)</text>
  <text x="773" y="280" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#5C6B78" text-anchor="middle">[conceptual hardware]</text>

  <rect x="670" y="296" width="206" height="40" rx="4" fill="#E6F5F5" stroke="#168C8C" stroke-width="2" stroke-dasharray="7,4"/>
  <text x="773" y="312" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#168C8C" text-anchor="middle">J4 Drive (rotary)</text>
  <text x="773" y="326" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#5C6B78" text-anchor="middle">[conceptual hardware]</text>

  <rect x="670" y="342" width="206" height="40" rx="4" fill="#E6F5F5" stroke="#168C8C" stroke-width="2" stroke-dasharray="7,4"/>
  <text x="773" y="358" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#168C8C" text-anchor="middle">Gripper Actuator</text>
  <text x="773" y="372" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#5C6B78" text-anchor="middle">[conceptual hardware]</text>

  <!-- Arrow: Controller → Actuation (Joint commands) -->
  <line x1="592" y1="265" x2="668" y2="265" stroke="#17324D" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="620" y="258" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#17324D" text-anchor="middle">Joint</text>
  <text x="620" y="270" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#17324D" text-anchor="middle">commands</text>

  <!-- Feedback arrow: Actuation back to Controller (state feedback, dashed) -->
  <path d="M 670 290 C 640 290 640 390 640 410 L 450 410 L 450 387" fill="none" stroke="#5C6B78" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-slate)"/>
  <text x="570" y="425" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5C6B78" text-anchor="middle">State feedback (dashed)</text>

  <!-- Arrow: Sensor2 (feedback) → Controller bottom -->
  <line x1="226" y1="258" x2="308" y2="310" stroke="#17324D" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="294" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#5C6B78">Joint</text>
  <text x="248" y="305" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#5C6B78">state</text>

  <!-- ===== ENVIRONMENT BOTTOM: Sort Bins ===== -->
  <rect x="310" y="450" width="280" height="52" rx="5" fill="#FFF8EC" stroke="#E5A842" stroke-width="2" stroke-dasharray="7,4"/>
  <text x="450" y="472" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#C07820" text-anchor="middle">ENVIRONMENT — OUTPUT</text>
  <text x="450" y="490" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#C07820" text-anchor="middle">Sort Bins B1 / B2 / B3</text>

  <!-- Arrow from actuation to bins -->
  <path d="M 773 384 L 773 430 L 592 452" fill="none" stroke="#168C8C" stroke-width="1.5" marker-end="url(#arrow-teal)" stroke-dasharray="5,3"/>
  <text x="700" y="445" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#168C8C">pkg deposited</text>

  <!-- ===== LEGEND ===== -->
  <rect x="22" y="490" width="265" height="82" rx="4" fill="#F8FAFB" stroke="#C8D8E0" stroke-width="1.5"/>
  <text x="32" y="508" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17324D">Legend</text>
  <rect x="32" y="516" width="28" height="14" rx="2" fill="#F0F5FA" stroke="#17324D" stroke-width="2"/>
  <text x="66" y="528" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#17324D">Solid border = implemented in simulation</text>
  <rect x="32" y="536" width="28" height="14" rx="2" fill="#EAF2F5" stroke="#246A8A" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="66" y="548" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#17324D">Dashed border = conceptual/hardware</text>
  <line x1="32" y1="565" x2="60" y2="565" stroke="#5C6B78" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-slate)"/>
  <text x="66" y="569" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#17324D">Dashed arrow = feedback / concept flow</text>

  <!-- ===== Bottom note ===== -->
  <text x="450" y="574" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5C6B78" text-anchor="middle">Note: All hardware elements are conceptual design — not yet selected or procured. Simulation implements controller logic only.</text>
</svg>
