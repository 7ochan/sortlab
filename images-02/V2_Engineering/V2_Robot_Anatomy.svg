<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="750" viewBox="0 0 1100 750">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#17324D"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#C0392B"/>
    </marker>
    <marker id="arrowhead-teal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#168C8C"/>
    </marker>
    <marker id="arrowhead-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E5A842"/>
    </marker>
    <marker id="arrowboth" markerWidth="10" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 3.5, 5 0, 5 7" fill="#5C6B78"/>
    </marker>
    <marker id="arrowboth-start" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#5C6B78"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="750" fill="#FAFAFA"/>

  <!-- Title -->
  <text x="550" y="38" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#17324D" text-anchor="middle">Fig. V2-1: Robot Anatomy — R-R-P-R Kinematic Chain</text>
  <text x="550" y="58" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5C6B78" text-anchor="middle">4 DOF (task axes): X, Y, Z, Yaw  |  All values are configured parameters</text>

  <!-- Panel divider -->
  <line x1="560" y1="70" x2="560" y2="730" stroke="#C8D6E0" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- ===== LEFT PANEL: FRONT ELEVATION ===== -->
  <text x="280" y="85" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#246A8A" text-anchor="middle">Front Elevation</text>

  <!-- Worktable -->
  <rect x="80" y="620" width="430" height="22" rx="2" fill="#5C6B78" stroke="#17324D" stroke-width="2"/>
  <text x="295" y="654" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5C6B78" text-anchor="middle">Workbench Surface</text>

  <!-- Base column -->
  <rect x="256" y="500" width="60" height="120" rx="3" fill="#17324D" stroke="#17324D" stroke-width="2"/>
  <text x="225" y="562" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#17324D" text-anchor="end">Base Column</text>
  <line x1="228" y1="560" x2="254" y2="556" stroke="#17324D" stroke-width="1" marker-end="url(#arrowhead)"/>

  <!-- Z-axis arrow (left side) -->
  <line x1="95" y1="610" x2="95" y2="470" stroke="#C0392B" stroke-width="2" marker-end="url(#arrowhead-red)"/>
  <text x="88" y="465" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#C0392B" text-anchor="middle">Z</text>
  <text x="88" y="477" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#C0392B" text-anchor="middle">↑</text>
  <line x1="95" y1="610" x2="120" y2="610" stroke="#246A8A" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="125" y="613" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#246A8A">X</text>

  <!-- J1 Shoulder Joint at top of base -->
  <circle cx="286" cy="498" r="22" fill="#EAF2F5" stroke="#17324D" stroke-width="3"/>
  <circle cx="286" cy="498" r="6" fill="#17324D"/>
  <text x="286" y="494" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" fill="#17324D" text-anchor="middle">J1</text>
  <!-- J1 label with leader line -->
  <line x1="308" y1="490" x2="380" y2="468" stroke="#17324D" stroke-width="1.2"/>
  <text x="384" y="462" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#17324D">J1 — Shoulder Revolute</text>
  <text x="384" y="474" font-family="Arial, Helvetica, sans-serif" font-size="9.5" fill="#5C6B78">(±150°, about Z-axis)</text>

  <!-- Link 1 -->
  <rect x="286" y="490" width="150" height="16" rx="4" fill="#246A8A" stroke="#17324D" stroke-width="2"/>
  <!-- Dimension line for L1 -->
  <line x1="286" y1="520" x2="436" y2="520" stroke="#5C6B78" stroke-width="1.2" marker-start="url(#arrowboth-start)" marker-end="url(#arrowboth)"/>
  <text x="361" y="534" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#246A8A" text-anchor="middle" font-weight="bold">L1 = 0.30 m</text>

  <!-- J2 Elbow Joint -->
  <circle cx="436" cy="498" r="18" fill="#EAF2F5" stroke="#246A8A" stroke-width="3"/>
  <circle cx="436" cy="498" r="5" fill="#246A8A"/>
  <text x="436" y="494" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="bold" fill="#17324D" text-anchor="middle">J2</text>
  <!-- J2 label -->
  <line x1="436" y1="480" x2="436" y2="455" stroke="#246A8A" stroke-width="1.2"/>
  <text x="342" y="450" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#246A8A">J2 — Elbow Revolute (±160°, about Z-axis)</text>

  <!-- Link 2 -->
  <rect x="436" y="490" width="125" height="14" rx="4" fill="#168C8C" stroke="#17324D" stroke-width="2"/>
  <!-- Dimension line for L2 -->
  <line x1="436" y1="545" x2="561" y2="545" stroke="#5C6B78" stroke-width="1.2" marker-start="url(#arrowboth-start)" marker-end="url(#arrowboth)"/>
  <text x="498" y="559" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#168C8C" text-anchor="middle" font-weight="bold">L2 = 0.25 m</text>

  <!-- J3 Prismatic — shown on a vertical guide -->
  <rect x="156" y="460" width="18" height="140" rx="3" fill="#F8FAFB" stroke="#E5A842" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="165" y1="465" x2="165" y2="595" stroke="#E5A842" stroke-width="1.5" marker-end="url(#arrowhead-amber)"/>
  <line x1="165" y1="595" x2="165" y2="470" stroke="#E5A842" stroke-width="1.5" marker-end="url(#arrowhead-amber)"/>
  <rect x="154" y="510" width="22" height="20" rx="2" fill="#E5A842" opacity="0.7"/>
  <text x="145" y="418" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#E5A842" text-anchor="middle">J3 — Prismatic (Z)</text>
  <text x="145" y="430" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#5C6B78" text-anchor="middle">0.30–0.58 m</text>
  <text x="145" y="442" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#5C6B78" text-anchor="middle">0.28 m travel</text>
  <line x1="145" y1="448" x2="153" y2="460" stroke="#E5A842" stroke-width="1"/>

  <!-- J4 Wrist Joint -->
  <circle cx="561" cy="497" r="14" fill="#EAF2F5" stroke="#168C8C" stroke-width="2.5"/>
  <circle cx="561" cy="497" r="4" fill="#168C8C"/>
  <text x="561" y="493" font-family="Arial, Helvetica, sans-serif" font-size="7.5" font-weight="bold" fill="#17324D" text-anchor="middle">J4</text>
  <line x1="515" y1="478" x2="547" y2="488" stroke="#168C8C" stroke-width="1.2"/>
  <text x="440" y="472" font-family="Arial, Helvetica, sans-serif" font-size="9.5" fill="#168C8C" font-weight="bold">J4 — Wrist Yaw (±180°, about Z-axis)</text>

  <!-- TCP cross -->
  <line x1="561" y1="520" x2="561" y2="560" stroke="#17324D" stroke-width="2"/>
  <line x1="545" y1="540" x2="577" y2="540" stroke="#17324D" stroke-width="2"/>
  <circle cx="561" cy="540" r="4" fill="none" stroke="#C0392B" stroke-width="2"/>
  <text x="580" y="535" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#C0392B">TCP</text>
  <text x="580" y="548" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#5C6B78">Tool Centre Point</text>

  <!-- Gripper jaws -->
  <rect x="540" y="562" width="14" height="35" rx="2" fill="#5C6B78" stroke="#17324D" stroke-width="1.5"/>
  <rect x="567" y="562" width="14" height="35" rx="2" fill="#5C6B78" stroke="#17324D" stroke-width="1.5"/>
  <!-- jaw open dashed -->
  <rect x="530" y="562" width="14" height="35" rx="2" fill="none" stroke="#5C6B78" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="577" y="562" width="14" height="35" rx="2" fill="none" stroke="#5C6B78" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- Dimension arrows for gripper -->
  <line x1="540" y1="605" x2="581" y2="605" stroke="#5C6B78" stroke-width="1.2" marker-start="url(#arrowboth-start)" marker-end="url(#arrowboth)"/>
  <text x="475" y="618" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#5C6B78">Parallel-Jaw Gripper (30–160 mm opening)</text>

  <!-- DOF label box -->
  <rect x="80" y="670" width="450" height="24" rx="4" fill="#EAF2F5" stroke="#246A8A" stroke-width="1.5"/>
  <text x="305" y="686" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17324D" text-anchor="middle">4 DOF (task axes): X, Y, Z, Yaw  |  Kinematic chain: R–R–P–R</text>

  <!-- ===== RIGHT PANEL: TOP VIEW ===== -->
  <text x="830" y="85" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#246A8A" text-anchor="middle">Top View (Bird's-Eye)</text>

  <!-- Top view base circle -->
  <circle cx="680" cy="420" r="28" fill="#17324D" stroke="#17324D" stroke-width="2.5"/>
  <text x="680" y="425" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="white" text-anchor="middle" font-weight="bold">Base</text>

  <!-- J1 sweep arc dashed ±150° -->
  <path d="M 680 420 L 830 420" stroke="#E5A842" stroke-width="1" stroke-dasharray="4,3" fill="none"/>
  <path d="M 680 420 L 611 299" stroke="#E5A842" stroke-width="1" stroke-dasharray="4,3" fill="none"/>
  <path d="M 830 420 A 150 150 0 0 0 611 299" stroke="#E5A842" stroke-width="1.5" stroke-dasharray="5,3" fill="rgba(229,168,66,0.08)"/>
  <path d="M 830 420 A 150 150 0 0 1 611 541" stroke="#E5A842" stroke-width="1.5" stroke-dasharray="5,3" fill="rgba(229,168,66,0.08)"/>
  <text x="850" y="425" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#E5A842">±150°</text>
  <text x="846" y="436" font-family="Arial, Helvetica, sans-serif" font-size="8" fill="#E5A842">(J1 sweep)</text>

  <!-- J1 joint circle on top view -->
  <circle cx="680" cy="420" r="16" fill="#EAF2F5" stroke="#E5A842" stroke-width="2"/>
  <text x="680" y="424" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="bold" fill="#17324D" text-anchor="middle">J1</text>

  <!-- Link 1 top view (horizontal) -->
  <rect x="680" y="412" width="130" height="16" rx="4" fill="#246A8A" stroke="#17324D" stroke-width="2"/>
  <text x="745" y="424" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="white" text-anchor="middle">L1 = 0.30 m</text>

  <!-- J2 on top view -->
  <circle cx="810" cy="420" r="14" fill="#EAF2F5" stroke="#246A8A" stroke-width="2.5"/>
  <text x="810" y="424" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="bold" fill="#17324D" text-anchor="middle">J2</text>

  <!-- Link 2 at ~60° elbow angle -->
  <line x1="810" y1="420" x2="875" y2="308" stroke="#168C8C" stroke-width="10" stroke-linecap="round"/>
  <text x="858" y="352" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#168C8C" text-anchor="start">L2=0.25m</text>

  <!-- J2 sweep arc ±160° dashed -->
  <path d="M 810 420 L 875 308" stroke="#C0392B" stroke-width="1" stroke-dasharray="4,3"/>
  <path d="M 810 420 L 935 420" stroke="#C0392B" stroke-width="1" stroke-dasharray="4,3"/>
  <path d="M 935 420 A 125 125 0 0 0 742 305" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="5,3" fill="rgba(192,57,43,0.06)"/>
  <text x="940" y="355" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#C0392B">±160°</text>
  <text x="940" y="366" font-family="Arial, Helvetica, sans-serif" font-size="8" fill="#C0392B">(J2 sweep)</text>

  <!-- TCP cross on top view -->
  <line x1="875" y1="294" x2="875" y2="322" stroke="#C0392B" stroke-width="2.5"/>
  <line x1="861" y1="308" x2="889" y2="308" stroke="#C0392B" stroke-width="2.5"/>
  <circle cx="875" cy="308" r="5" fill="none" stroke="#C0392B" stroke-width="2"/>
  <text x="895" y="304" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#C0392B">TCP / J4</text>

  <!-- World frame axes on top view -->
  <line x1="620" y1="580" x2="665" y2="580" stroke="#246A8A" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="670" y="584" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#246A8A">X</text>
  <line x1="620" y1="580" x2="620" y2="535" stroke="#C0392B" stroke-width="2" marker-end="url(#arrowhead-red)"/>
  <text x="613" y="528" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#C0392B">Y</text>
  <text x="610" y="597" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#5C6B78">{W} Top</text>

  <!-- Reach annotation -->
  <line x1="680" y1="620" x2="1010" y2="620" stroke="#168C8C" stroke-width="1.5" stroke-dasharray="6,3" marker-start="url(#arrowboth-start)" marker-end="url(#arrowboth)"/>
  <text x="845" y="636" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#168C8C" text-anchor="middle" font-weight="bold">Max reach ≈ 0.55 m (L1+L2, analytic ideal)</text>
  <line x1="680" y1="635" x2="740" y2="620" stroke="#168C8C" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="845" y="650" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#5C6B78" text-anchor="middle">Min usable reach ≈ 0.05 m (singular region near base)</text>

  <!-- Kinematic chain label box -->
  <rect x="600" y="660" width="460" height="60" rx="5" fill="#EAF2F5" stroke="#246A8A" stroke-width="1.5"/>
  <text x="830" y="678" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#17324D" text-anchor="middle">Kinematic Chain Summary</text>
  <text x="830" y="694" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5C6B78" text-anchor="middle">J1: Shoulder Rev. ±150°  |  J2: Elbow Rev. ±160°</text>
  <text x="830" y="709" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5C6B78" text-anchor="middle">J3: Prismatic Z 0.30–0.58 m  |  J4: Wrist Yaw ±180°</text>

  <!-- Config note -->
  <rect x="80" y="700" width="460" height="20" rx="3" fill="#FFF8EC" stroke="#E5A842" stroke-width="1"/>
  <text x="310" y="714" font-family="Arial, Helvetica, sans-serif" font-size="9.5" fill="#5C6B78" text-anchor="middle">⚠ All joint limits and link lengths are configured parameters, not measured hardware values.</text>
</svg>
